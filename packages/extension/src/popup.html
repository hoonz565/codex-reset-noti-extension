<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Codex Reset Notifier</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Codex Reset Notifier</h1>
      <p>Unofficial community alerts for Codex quota-reset signals.</p>
    </header>
    <div id="dashboard-container"></div>

    <section aria-labelledby="subscribe-heading">
      <h2 id="subscribe-heading">Choose your alerts</h2>
      <label class="choice"
        ><input type="checkbox" id="alert-70" checked /> Likelihood reaches 70%</label
      >
      <label class="choice"
        ><input type="checkbox" id="alert-announced" checked /> A reset is announced</label
      >
      <label for="email">Email address</label>
      <input type="email" id="email" autocomplete="email" required />
      <button id="subscribe-btn" type="button">Subscribe</button>
      <div id="sub-result" class="form-message" role="status" aria-live="polite"></div>
    </section>

    <details>
      <summary>Manage an existing subscription</summary>
      <label for="manage-email">Email address</label>
      <input type="email" id="manage-email" autocomplete="email" required />
      <button id="manage-btn" type="button">Email me a secure link</button>
      <div id="manage-result" class="form-message" role="status" aria-live="polite"></div>
    </details>

    <footer>Not affiliated with OpenAI. Reset timing is not guaranteed.</footer>

    <script src="popup.js"></script>
  </body>
</html>
